name: Daily fetch

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC, after Ukraine publishes the morning report
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit losses.db back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add losses.db
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
